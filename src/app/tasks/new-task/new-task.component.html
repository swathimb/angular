<dialog class="" open>
    <form class="m-4 p-4 rounded-lg border bg-sky-50" (ngSubmit)="onSubmit()">
        <p>
            <label>
                Titel:
                <input class="border m-2 p-2" title="title" name="title" id="title" [(ngModel)]="title"/>
                
            </label>
        </p>
    
        <p>
            <label>
                Summary:
                <textarea class="border m-2 p-2" title="summary" name="summary" id="summary" [(ngModel)]="summary"></textarea>
                
            </label>
        </p>
        <div class="flex justify-between">
            <button class="hover:bg-indigo-500 bg-indigo-300 rounded-lg  p-2" (click)="onClose()">Cancel</button>
            <button type="submit" class="hover:bg-indigo-500 bg-indigo-300 rounded-lg p-2">Confirm</button>
        </div>
    </form>
</dialog>
